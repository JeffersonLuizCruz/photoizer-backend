name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

# Deploy de PROD (ambiente unico):
#   push/merge na main (ou tag vX.Y.Z)
#     -> test (CI) -> publish (GHCR) -> deploy-prod (aprovacao manual)
#
# O push no GHCR usa o GITHUB_TOKEN nativo (permissions: packages: write);
# nao ha secret de registry. Habilitar "Read and write" em
# Settings > Actions > General > Workflow permissions.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   COOLIFY_URL           -> base da API (ex.: https://coolify.photoizer.com.br)
#   COOLIFY_TOKEN         -> API token do Coolify (escopo de deploy)
#   COOLIFY_PROD_APP_UUID -> UUID do app de PROD no Coolify

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes (H2 em memoria)
        run: mvn -B verify

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nome de imagem minusculo.
      - name: Definir imagem (GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=prod
            type=raw,value=latest

      - name: Build e push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy PROD no Coolify
        run: |
          curl -fsS -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_PROD_APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_APP_UUID: ${{ secrets.COOLIFY_PROD_APP_UUID }}
