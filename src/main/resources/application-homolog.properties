# Perfil de Homologação
# Ativar com: --spring.profiles.active=homolog

logging.file.path=/var/log/crm

# CORS definido por ambiente (nunca hardcoded).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Exigir HTTPS para cookies de autenticação em homologação (ajuste se usar HTTP).
app.security.cookie.secure=${COOKIE_SECURE:true}

# Bootstrap do primeiro ADMIN (apenas se a tabela users estiver vazia).
# Em homologação o boot não falha sem credenciais (required=false) para
# facilitar ambientes de teste; defina ADMIN_EMAIL/ADMIN_PASSWORD no ambiente.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.required=${ADMIN_BOOTSTRAP_REQUIRED:false}

management.tracing.sampling.probability=1.0
