# Perfil de Homologação
# Ativar com: --spring.profiles.active=homolog

logging.file.path=/app/logs

# CORS definido por ambiente (nunca hardcoded).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Exigir HTTPS para cookies de autenticação em homologação (ajuste se usar HTTP).
app.security.cookie.secure=${COOKIE_SECURE:true}

# Os usuarios iniciais (ADMIN e AGENDADOR) sao semeados pelo Flyway
# (V2__seed_usuarios_iniciais.sql). ADMIN_EMAIL/ADMIN_PASSWORD so agem como rede
# de seguranca se a tabela users estiver vazia. Em homologação o boot não falha
# sem credenciais (required=false) para facilitar ambientes de teste.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.required=${ADMIN_BOOTSTRAP_REQUIRED:false}

# Rotacao forcada das credenciais semeadas pela V2 (AdminCredentialRotationSeeder):
# se o agendador ainda usar 'dev123' e AGENDADOR_PASSWORD nao for definido, a conta
# e desativada; se definido (>=12 chars), a senha e rotacionada no boot.
app.bootstrap.agendador.password=${AGENDADOR_PASSWORD:}

management.tracing.sampling.probability=1.0
