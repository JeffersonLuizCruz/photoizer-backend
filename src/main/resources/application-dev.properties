# Perfil de Desenvolvimento
# Ativar com: --spring.profiles.active=dev (ja e o padrao em application.properties)
#
# Em desenvolvimento usamos H2 em arquivo e recriamos o schema a cada subida
# (ddl-auto=create), pois os dados de dev sao descartaveis e ainda nao ha
# migrations versionadas. Isso evita drift de schema (colunas NOT NULL antigas,
# colunas removidas). Na promocao para homologacao sera adicionado Flyway +
# Postgres com ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Segredo JWT EXCLUSIVO de desenvolvimento (descartavel, >=32 bytes).
# Fora do perfil dev (homolog/prod) o JWT_SECRET e obrigatorio via variavel
# de ambiente e o boot falha se ausente.
app.jwt.secret=photoizer-dev-secret-key-not-for-production-minimum-256-bits-000
