spring.application.name=crm

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

spring.datasource.url=jdbc:h2:file:./data/crmdb;AUTO_RECONNECT=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

logging.file.path=logs

app.file.upload-dir=uploads

management.tracing.sampling.probability=1.0

app.jwt.secret=${JWT_SECRET:photoizer-crm-secret-key-change-in-production-minimum-256-bits-long-for-hs256}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Rate limiting
app.rate-limit.window-ms=60000
app.rate-limit.maximum-size=10000
app.rate-limit.limits./download-zip=5
app.rate-limit.limits./checkout=10
app.rate-limit.limits./comprovante=10
app.rate-limit.limits./selecionar=60
app.rate-limit.limits./sessao=30

#
