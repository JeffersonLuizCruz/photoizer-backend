spring.application.name=crm

# Perfil de desenvolvimento ativo por padrao. Em homolog/prod, sobrescreva com
# a variavel de ambiente SPRING_PROFILES_ACTIVE=homolog|prod.
spring.profiles.active=dev

# Limites de upload reduzidos (antes 500MB/1GB) para mitigar DoS/enchimento de disco.
# Fotos/RAW podem ser grandes; documentos e comprovantes têm limite próprio no FileValidator.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# --- Datasource PostgreSQL (todos os ambientes, inclusive dev) ---
# Os defaults apontam para o Postgres local do docker-compose.dev.yml.
# Em cada ambiente sobrescreva com SPRING_DATASOURCE_URL/USERNAME/PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/photoizer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:photoizer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:photoizer}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# O schema e responsabilidade do Flyway (db/migration); o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate

# Migracoes versionadas. Ver docs/infra/PLANO_INFRAESTRUTURA_E_DEPLOY.md (secao 10).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Atras do proxy reverso (Coolify/Traefik): respeita X-Forwarded-* para cookies/redirects.
server.forward-headers-strategy=framework

logging.file.path=${LOG_PATH:logs}

# Diretorio de uploads (volume persistente no container). Caminhos sao gravados
# de forma relativa a este diretorio no banco.
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# CORS — origens permitidas (scheme + host + porta), separadas por vírgula.
# Com o roteamento same-domain via proxy Nginx (/api), o navegador nao faz
# requisicoes cross-site em homolog/prod; os defaults servem ao dev local (Vite).
# Em homolog/prod sobrescreva com os dominios reais (nunca use "*" com credenciais).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Cookie de autenticação: Secure=true requer HTTPS. Habilite em homolog/prod.
app.security.cookie.secure=${COOKIE_SECURE:false}

management.tracing.sampling.probability=1.0

# Obrigatório fora de dev (homolog/prod). Sem default no perfil base para não
# assinar tokens com segredo versionado; o perfil dev fornece um default descartável.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Rate limiting (janela de 60s por IP + endpoint)
app.rate-limit.window-ms=60000
app.rate-limit.maximum-size=10000
app.rate-limit.limits./download-zip=5
app.rate-limit.limits./checkout=10
app.rate-limit.limits./comprovante=10
app.rate-limit.limits./selecionar=60
app.rate-limit.limits./sessao=30
# Proteção contra brute-force/abuso em autenticação e endpoints públicos
app.rate-limit.limits./auth/login=10
app.rate-limit.limits./auth/refresh=20
app.rate-limit.limits./auth/cliente/login=10
app.rate-limit.limits./auth/cliente/registro=5
app.rate-limit.limits./propostas/publico=20
app.rate-limit.limits./avaliacoes=10

# --- OpenAPI / Swagger (springdoc) ---
# UI exposta apenas em dev (permitAll) e homolog (staff autenticado); negada em prod.
# Ver SecurityConfig e docs/API_DOCUMENTATION_STANDARD.md.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.photoizer.crm
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
