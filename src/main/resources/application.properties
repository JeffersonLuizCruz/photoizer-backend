spring.application.name=crm

# Perfil de desenvolvimento ativo por padrao. Em homolog/prod, sobrescreva com
# a variavel de ambiente SPRING_PROFILES_ACTIVE=homolog|prod (Flyway + Postgres).
spring.profiles.active=dev

# Limites de upload reduzidos (antes 500MB/1GB) para mitigar DoS/enchimento de disco.
# Fotos/RAW podem ser grandes; documentos e comprovantes têm limite próprio no FileValidator.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

spring.datasource.url=jdbc:h2:file:./data/crmdb;AUTO_RECONNECT=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Fallback: sobrescrito em dev (create) e, no futuro, em homolog/prod (validate + Flyway).
spring.jpa.hibernate.ddl-auto=update

logging.file.path=logs

app.storage.upload-dir=uploads

# CORS — origens permitidas (scheme + host + porta), separadas por vírgula.
# Em homolog/prod sobrescreva com os domínios reais (nunca use "*" com credenciais).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Cookie de autenticação: Secure=true requer HTTPS. Habilite em homolog/prod.
app.security.cookie.secure=${COOKIE_SECURE:false}

management.tracing.sampling.probability=1.0

# Obrigatório. Sem default: o boot falha se JWT_SECRET não for definido, evitando
# assinar tokens com um segredo público versionado no repositório.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Rate limiting (janela de 60s por IP + endpoint)
app.rate-limit.window-ms=60000
app.rate-limit.maximum-size=10000
app.rate-limit.limits./download-zip=5
app.rate-limit.limits./checkout=10
app.rate-limit.limits./comprovante=10
app.rate-limit.limits./selecionar=60
app.rate-limit.limits./sessao=30
# Proteção contra brute-force/abuso em autenticação e endpoints públicos
app.rate-limit.limits./auth/login=10
app.rate-limit.limits./auth/refresh=20
app.rate-limit.limits./auth/cliente/login=10
app.rate-limit.limits./auth/cliente/registro=5
app.rate-limit.limits./propostas/publico=20
app.rate-limit.limits./avaliacoes=10

