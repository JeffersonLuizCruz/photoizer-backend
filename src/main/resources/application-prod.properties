# Perfil de Produção
# Ativar com: --spring.profiles.active=prod

logging.file.path=/app/logs

# CORS deve ser definido via variável de ambiente APP_CORS_ALLOWED_ORIGINS.
# Sem default: origens vazias = nenhuma origem cross-site permitida.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# Exigir HTTPS para cookies de autenticação em produção.
app.security.cookie.secure=true

# Os usuarios iniciais (ADMIN e AGENDADOR) sao semeados pelo Flyway
# (V2__seed_usuarios_iniciais.sql), entao a tabela users nao nasce vazia.
# ADMIN_EMAIL/ADMIN_PASSWORD permanecem como rede de seguranca: so sao usados
# se a tabela users estiver vazia. Sem eles e com users vazio, a subida falha.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.required=true

spring.jpa.show-sql=false

management.tracing.sampling.probability=1.0
