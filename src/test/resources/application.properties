spring.application.name=crm

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1GB

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Os testes usam H2 em memoria com schema criado pelo Hibernate (create-drop).
# O Flyway e desabilitado: as migracoes em db/migration sao especificas de PostgreSQL.
spring.flyway.enabled=false

# Sem bootstrap de admin nos testes (tabela users vazia nao deve falhar o boot).
app.bootstrap.admin.required=false

app.jwt.secret=photoizer-crm-secret-key-change-in-production-minimum-256-bits-long-for-hs256
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

app.security.cookie.secure=false
app.cors.allowed-origins=http://localhost:5173

app.rate-limit.window-ms=60000
app.rate-limit.maximum-size=10000
